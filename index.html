.brand-tag{font-family:var(--app-font-mono);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:hsl(var(--primary))}
.nav-links{display:none;align-items:center;gap:.2rem}
@media (min-width:820px){.nav-links{display:flex}}
.nav-link{padding:.5rem .95rem;border-radius:999px;font-size:.82rem;font-weight:600;color:hsl(var(--muted-foreground));text-decoration:none;transition:color .2s,background-color .2s}
.nav-link:hover{color:hsl(var(--foreground));background:rgba(142,182,155,.12)}
.nav-cta{display:inline-flex;align-items:center;gap:.55rem;min-height:44px;padding:0 1.15rem;border-radius:999px;font-size:.82rem;font-weight:700;letter-spacing:.01em;color:#051F20;text-decoration:none;background:linear-gradient(135deg,#DAF1DE 0%,#B5D6BF 55%,#8EB69B 100%);box-shadow:0 10px 28px rgba(142,182,155,.28),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(5,31,32,.18);transition:transform .2s,box-shadow .2s,filter .2s}
.nav-cta:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 14px 34px rgba(142,182,155,.4),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(5,31,32,.18)}
.nav-cta-arrow{transition:transform .2s}.nav-cta:hover .nav-cta-arrow{transform:translateX(3px)}
@media (max-width:480px){.brand-tag{display:none}.nav-cta{padding:0 .95rem;font-size:.78rem}}
.brand-logo{box-shadow:0 0 0 1px hsl(var(--primary) / .3),0 10px 30px rgba(142,182,155,.16)}
.eyebrow{color:#8EB69B;letter-spacing:.22em}
.hero-title{font-family:var(--app-font-display);font-weight:500;letter-spacing:-.025em;line-height:1;font-size:clamp(2.9rem,7.6vw,5.5rem);max-width:780px}
.hero-title em{font-style:italic;background:linear-gradient(120deg,#DAF1DE,#8EB69B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-copy{color:hsl(var(--muted-foreground));font-size:1.04rem;max-width:560px}
.btn-primary{color:#051F20;border-radius:999px;font-weight:700;letter-spacing:.01em;background:linear-gradient(135deg,#DAF1DE 0%,#B5D6BF 55%,#8EB69B 100%);box-shadow:0 12px 30px rgba(142,182,155,.24),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(5,31,32,.16)}
.btn-primary:hover{background:linear-gradient(135deg,#E8F8EB 0%,#C3E0CC 55%,#9CC4A9 100%);transform:translateY(-1px);box-shadow:0 16px 38px rgba(142,182,155,.34),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(5,31,32,.16)}
.btn-primary:disabled{opacity:.5;transform:none;box-shadow:none}
.btn-secondary{border-radius:999px;color:hsl(var(--foreground));border:1px solid hsl(165 33% 32% / .7);background:rgba(22,56,50,.55)}
.btn-secondary:hover{background:rgba(35,83,71,.6);border-color:hsl(139 22% 64% / .5)}
.btn-quiet{border-radius:999px}
.panel{border:1px solid hsl(165 33% 28% / .6);border-radius:1.4rem;background:linear-gradient(150deg,rgba(22,56,50,.56),rgba(11,43,38,.8));box-shadow:0 30px 80px rgba(0,0,0,.32),inset 0 1px 0 rgba(218,241,222,.07)}
.panel-soft{border:1px solid hsl(165 33% 26% / .6);border-radius:1.1rem;background:rgba(11,43,38,.55)}
.export-panel{background:linear-gradient(150deg,rgba(22,56,50,.62),rgba(11,43,38,.88))}
.dropzone{border:1px dashed hsl(139 22% 64% / .42);border-radius:1.2rem;background:linear-gradient(150deg,rgba(142,182,155,.07),rgba(11,43,38,.25))}
.stat-value{font-family:var(--app-font-display);font-weight:600;letter-spacing:-.01em;font-size:clamp(1.55rem,4vw,2.1rem)}
.method-option label{border-radius:999px;background:rgba(11,43,38,.4)}
.method-option label:hover{border-color:hsl(139 22% 64% / .5);color:hsl(var(--foreground))}
.method-option input:checked+label{color:#DAF1DE;border-color:hsl(139 22% 64% / .75);background:linear-gradient(135deg,rgba(218,241,222,.17),rgba(142,182,155,.15));box-shadow:inset 0 1px 0 rgba(218,241,222,.12)}
.setting-control{border-radius:.85rem;background-color:hsl(var(--secondary))}
.manual-starts{min-height:96px;padding:.7rem .8rem;font-family:var(--app-font-mono);font-size:.82rem;line-height:1.55;resize:vertical}
.manual-actions{margin-top:.6rem}.manual-actions .btn-quiet{border:1px solid hsl(165 33% 32% / .7);color:hsl(var(--foreground));background:rgba(22,56,50,.45)}.manual-actions .btn-quiet:hover{background:rgba(35,83,71,.6)}
.chapter-row{transition:background-color .2s}.chapter-row:hover{background:rgba(142,182,155,.06)}
.modes-section{margin:5.5rem 0 3.5rem}
.modes-head{margin-bottom:2rem}
.modes-title{font-family:var(--app-font-display);font-weight:500;font-size:clamp(2.1rem,4.8vw,3.3rem);letter-spacing:-.02em;line-height:1.05;margin-top:.6rem}
.modes-grid{display:grid;gap:1rem;grid-template-columns:1fr}@media (min-width:600px){.modes-grid{grid-template-columns:repeat(2,1fr)}}@media (min-width:960px){.modes-grid{grid-template-columns:repeat(3,1fr)}}
.mode-card{padding:1.5rem;border-radius:1.25rem;border:1px solid hsl(165 33% 26% / .6);background:linear-gradient(160deg,rgba(22,56,50,.52),rgba(11,43,38,.72));box-shadow:inset 0 1px 0 rgba(218,241,222,.05);transition:transform .25s,border-color .25s}
.mode-card:hover{transform:translateY(-3px);border-color:hsl(139 22% 64% / .5)}
.mode-index{font-family:var(--app-font-mono);font-size:.7rem;letter-spacing:.16em;color:hsl(var(--primary))}
.mode-name{font-family:var(--app-font-display);font-size:1.8rem;font-weight:600;line-height:1.1;margin:.6rem 0 .45rem}
.mode-desc{color:hsl(var(--muted-foreground));font-size:.9rem;line-height:1.65}
</style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
